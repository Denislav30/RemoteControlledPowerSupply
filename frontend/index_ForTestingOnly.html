<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimex Fan Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fan-active { color: #10b981; animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">

    <div id="app" class="max-w-md mx-auto">
        <div id="login-section" class="bg-slate-800 p-6 rounded-xl shadow-xl mt-10">
            <h2 class="text-2xl font-bold mb-4 text-center">Вход в системата</h2>
            <input id="username" type="text" placeholder="Потребител" class="w-full mb-3 p-2 rounded bg-slate-700 border-none outline-none" value="admin">
            <input id="password" type="password" placeholder="Парола" class="w-full mb-4 p-2 rounded bg-slate-700 border-none outline-none" value="admin">
            <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 p-2 rounded font-bold transition">ВХОД</button>
        </div>

        <div id="dashboard" class="hidden space-y-4">
            
            <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center border-l-4 border-blue-500">
                <div>
                    <p class="text-slate-400 text-sm uppercase">Температура</p>
                    <h1 id="temp-display" class="text-4xl font-black">--°C</h1>
                </div>
                <div class="text-right">
                    <p class="text-slate-400 text-sm uppercase">Захранване</p>
                    <h1 id="volt-display" class="text-2xl font-bold text-emerald-400">--V</h1>
                </div>
            </div>

            <div id="alert-hw" class="hidden bg-red-600/20 border border-red-600 p-2 rounded text-red-500 text-sm text-center">
                Грешка в хардуерната комуникация!
            </div>

            <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center">
                <span class="font-bold uppercase tracking-widest">Режим: <span id="mode-text">--</span></span>
                <button onclick="toggleMode()" id="mode-btn" class="bg-amber-500 text-slate-900 px-4 py-1 rounded-full font-bold text-sm">
                    СМЕНИ РЕЖИМ
                </button>
            </div>

            <div class="bg-slate-800 p-4 rounded-xl">
                <h3 class="mb-3 font-bold border-b border-slate-700 pb-2 italic">Управление на вентилатори</h3>
                <div id="fans-container" class="space-y-3">
                    </div>
            </div>

            <div class="bg-slate-800 p-4 rounded-xl">
                <h3 class="mb-3 font-bold border-b border-slate-700 pb-2 italic">Настройка на прагове (°C)</h3>
                <div class="grid grid-cols-3 gap-2">
                    <input id="t1" type="number" step="0.1" class="bg-slate-700 p-2 rounded text-center outline-none">
                    <input id="t2" type="number" step="0.1" class="bg-slate-700 p-2 rounded text-center outline-none">
                    <input id="t3" type="number" step="0.1" class="bg-slate-700 p-2 rounded text-center outline-none">
                </div>
                <button onclick="updateThresholds()" class="w-full mt-3 bg-indigo-600 p-2 rounded text-sm font-bold uppercase tracking-tighter">Запази праговете</button>
            </div>

        </div>
    </div>

    <script>
        const API_URL = "http://192.168.100.123:8000"; // Промени според IP-то на твоя Olimex
        let token = "";
        let isManual = false;

        async function login() {
            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const res = await fetch(`${API_URL}/login`, { method: 'POST', body: formData });
                const data = await res.json();
                if (data.access_token) {
                    token = data.access_token;
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    startPolling();
                } else { alert("Грешни данни!"); }
            } catch (e) { alert("Сървърът не отговаря!"); }
        }

        async function updateUI() {
            try {
                const res = await fetch(`${API_URL}/status`);
                const data = await res.json();

                document.getElementById('temp-display').innerText = `${data.sensor_data.temperature.toFixed(1)}°C`;
                document.getElementById('volt-display').innerText = data.sensor_data.power_supply;
                document.getElementById('mode-text').innerText = data.system_mode;
                
                isManual = data.system_mode === "MANUAL";
                document.getElementById('alert-hw').classList.toggle('hidden', !data.sensor_data.hw_error);

                // Update thresholds inputs if not focused
                if (document.activeElement.tagName !== 'INPUT') {
                    document.getElementById('t1').value = data.config.thresholds[0];
                    document.getElementById('t2').value = data.config.thresholds[1];
                    document.getElementById('t3').value = data.config.thresholds[2];
                }

                // Render Fans
                const container = document.getElementById('fans-container');
                container.innerHTML = data.fans.map((on, i) => `
                    <div class="flex justify-between items-center bg-slate-700/50 p-2 rounded">
                        <div class="flex items-center gap-3">
                            <span class="${on ? 'fan-active' : 'text-slate-500'}">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M12 12v-4"/><path d="M12 12l-3.5 3.5"/><path d="M12 12l3.5 3.5"/></svg>
                            </span>
                            <span>Fan #${i+1}</span>
                        </div>
                        <button 
                            onclick="toggleFan(${i+1}, ${!on})" 
                            ${!isManual ? 'disabled' : ''}
                            class="px-4 py-1 rounded text-xs font-bold ${!isManual ? 'bg-slate-600 opacity-50' : (on ? 'bg-red-500' : 'bg-emerald-500')}">
                            ${on ? 'STOP' : 'START'}
                        </button>
                    </div>
                `).join('');

            } catch (e) { console.error("Update error", e); }
        }

        async function toggleMode() {
            await fetch(`${API_URL}/mode?manual=${!isManual}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            updateUI();
        }

        async function toggleFan(id, state) {
            await fetch(`${API_URL}/fans/${id}?on=${state}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            updateUI();
        }

        async function updateThresholds() {
            const t = [
                parseFloat(document.getElementById('t1').value),
                parseFloat(document.getElementById('t2').value),
                parseFloat(document.getElementById('t3').value)
            ];
            await fetch(`${API_URL}/thresholds`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(t)
            });
            alert("Праговете са обновени!");
        }

        function startPolling() {
            updateUI();
            setInterval(updateUI, 2000);
        }
    </script>
</body>
</html>
